<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malínský Burger festival 2026</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Úprava záře na červenou */
        .text-shadow-glow { text-shadow: 0 0 30px rgba(220, 38, 38, 0.7); }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .animate-bounce { animation: bounce 2s infinite ease-in-out; }
        html { scroll-behavior: smooth; }
        .mobile-menu-overlay { z-index: 9999 !important; background-color: #0a0a0a !important; }
        .clickable-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .clickable-card:hover { transform: translateY(-5px); border-color: #dc2626; box-shadow: 0 10px 30px -10px rgba(220, 38, 38, 0.3); }
        input, textarea { background: #171717 !important; border: 1px solid #262626 !important; }
        input:focus { border-color: #dc2626 !important; outline: none; }
        .paka-card-glow { box-shadow: 0 0 60px -15px rgba(220, 38, 38, 0.15); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const tourneyPdfUrl = "Návrh bez názvu.pdf"; 
        const googleFormUrl = "https://forms.gle/FG1eBjLXpW4HGcYg6";
        const mainPosterUrl = "MB_2026.jpg"; // Cesta k hlavnímu plakátu akce (stačí nahrát MB_2026.jpg na GitHub)

        const Icon = ({ name, size = 24, className = "" }) => {
            const icons = {
                Utensils: <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7" />,
                Trophy: <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.66V17c0 .55.45 1 1 1h2c.55 0 1-.45 1-1v-2.34M12 2v12.66" />,
                Ticket: <path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v2ZM13 5v2M13 17v2M13 11v2" />,
                Clock: <><circle cx="12" cy="12" r="10" /><path d="M12 6v6l4 2" /></>,
                MapPin: <><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" /><circle cx="12" cy="10" r="3" /></>,
                Menu: <><line x1="4" x2="20" y1="12" y2="12" /><line x1="4" x2="20" y1="6" y2="6" /><line x1="4" x2="20" y1="18" y2="18" /></>,
                X: <><line x1="18" x2="6" y1="6" y2="18" /><line x1="6" x2="18" y1="6" y2="18" /></>,
                Beer: <path d="M17 11h1a3 3 0 0 1 0 6h-1M5 21h12M5 3h12M5 3v18M17 3v18" />,
                Coffee: <path d="M18 8h1a4 4 0 0 1 0 8h-1M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8zM6 1v3M10 1v3M14 1v3" />,
                Mail: <><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" /><polyline points="22,6 12,13 2,6" /></>,
                Phone: <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 .81.7A2 2 0 0 1 22 16.92z" />,
                Users: <><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M22 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /></>,
                Star: <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />,
                FileText: <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z" />,
                ChevronRight: <path d="m9 18 6-6-6-6" />,
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || null}
                </svg>
            );
        };

        const Countdown = () => {
            const targetDate = new Date('June 27, 2026 10:00:00').getTime();
            const [timeLeft, setTimeLeft] = useState({ d: 0, h: 0, m: 0, s: 0 });

            useEffect(() => {
                const timer = setInterval(() => {
                    const now = new Date().getTime();
                    const distance = targetDate - now;
                    if (distance < 0) { clearInterval(timer); } 
                    else {
                        setTimeLeft({
                            d: Math.floor(distance / (1000 * 60 * 60 * 24)),
                            h: Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)),
                            m: Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60)),
                            s: Math.floor((distance % (1000 * 60)) / 1000)
                        });
                    }
                }, 1000);
                return () => clearInterval(timer);
            }, []);

            return (
                <div className="inline-flex gap-3 text-red-600 font-black italic text-[11px] tracking-widest uppercase bg-black/40 px-4 py-2 rounded-full backdrop-blur-sm border border-red-600/20">
                    <span>{timeLeft.d}d</span>
                    <span>{timeLeft.h}h</span>
                    <span>{timeLeft.m}m</span>
                    <span>{timeLeft.s}s</span>
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('home');
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [scrolled, setScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const goToHome = () => {
                setActiveTab('home');
                window.scrollTo(0, 0);
            };

            const foodVendors = [
                { name: "Cakir´s", desc: "Vymazlené burgery s dlouholetou tradicí a láskou ke gastronomii." },
                { name: "U Dřeváka", desc: "Poctivá klasika z grilu." },
                { name: "Smashing Machine", desc: "Mistři smash burgerů." },
                { name: "Balikejk", desc: "Exotický indonéský street food." },
                { name: "Malínské smažené kuře", desc: "Křupavé kousky podle lokální receptury." },
                { name: "Dos Amigos", desc: "Tacos a quesadillas v mexickém stylu." },
                { name: "The Pitmaster's Soul", desc: "Pravé BBQ: Šťavnatá žebírka a křídla v tradičním USA stylu." },
                { name: "Badass American Hot Dog", desc: "Prémiové hot dogy s bohatou oblohou a domácími recepturami." },
                { name: "Underground Meat Lab", desc: "Bistro ve sklepě: Burgery se zauzeným jazykem, morkem a Bacon Boom speciál." }
            ];

            const partners = [
                { name: "Obec Nový Malín", role: "Generální partner", url: "https://www.novymalin.cz/" }, 
                { name: "AMC KAŠPAR", role: "Partner", url: "https://www.kiakaspar.cz/" }, 
                { name: "SK Buildings", role: "Partner", url: "https://www.skbuildings.cz/" },
                { name: "HUF & PARTNERS REALITY", role: "Partner", url: "https://www.hufpartners.cz/" },
                { name: "ROADMEDIC", role: "Partner", url: "https://www.roadmedic.cz/" },
                { name: "CONTI-RSC", role: "Partner", url: "https://www.conti-rsc.cz/" },
                { name: "Gruno s.r.o.", role: "Partner", url: "https://www.gruno.cz/" },
                { name: "Macte", role: "Partner", url: "https://www.macte.cz/" },
                { name: "Sefran", role: "Partner", url: "https://www.sefran.cz/" },
                { name: "Ošetření dřeva", role: "Partner", url: "https://www.osetrenidreva.cz/" },
                { name: "Lité podlahy Hoško", role: "Partner", url: "https://www.litepodlahyhosko.cz/" },
                { name: "Šumperský rej", role: "Mediální partner", url: "https://www.sumperskyrej.cz/" },
                { name: "Obchůdek s kvítím", role: "Partner", url: "https://www.facebook.com/obchudekskvitim/" },
                { name: "Mikistav", role: "Partner", url: "https://www.mikistav.cz/" },
                { name: "Smartstep Šumperk", role: "Partner", url: "https://www.smartstep.cz/" },
                { name: "TESPO-TOPENÁŘSKÉ CENTRUM", role: "Partner", url: "https://www.tespo-sumperk.cz/" },
                { name: "Statek Winter", role: "Partner", url: "https://www.statekwinter.cz/" },
                { name: "Via Delicia", role: "Partner", url: "https://www.viadelicia.cz/" }, 
                { name: "JANDA DESIGN", role: "Partner", url: "https://www.jandadesign.cz/" },
                { name: "Jiří Stuchlý", role: "Partner", url: "https://www.youtube.com/results?search_query=Jiří+Stuchlý" },
                { name: "ČAWA", role: "Sportovní záštita", url: "http://www.armwrestling.cz/" }, 
                { name: "Děti dětem", role: "Iniciativa", url: "http://www.detidetem.com/" }
            ];

            const Navigation = () => (
                <nav className={`fixed w-full z-50 transition-all ${scrolled ? 'bg-black py-2 shadow-2xl border-b border-red-600/30' : 'bg-transparent py-4'}`}>
                    <div className="container mx-auto px-4 md:px-6 flex justify-between items-center h-12">
                        <div className="flex items-center cursor-pointer" onClick={goToHome}>
                            <div className="text-lg md:text-2xl font-black italic tracking-tighter uppercase leading-none text-white">
                                <span className="text-red-600">MALÍNSKÝ</span> BURGER <span className="text-red-600 underline decoration-2 underline-offset-4">FESTIVAL</span> 2026
                            </div>
                        </div>
                        <div className="hidden lg:flex space-x-6 items-center font-bold uppercase text-[11px] tracking-widest text-neutral-300">
                            <button onClick={goToHome} className={`hover:text-red-600 transition ${activeTab === 'home' ? 'text-red-600' : ''}`}>Domů</button>
                            <a href="#info" className="hover:text-red-600 transition">O Festivalu</a>
                            <a href="#plakat" className="hover:text-red-600 transition">Plakát</a>
                            <a href="#pivo" className="hover:text-red-600 transition">Pivo</a>
                            <a href="#jidlo" className="hover:text-red-600 transition">Gril</a>
                            <a href="#program" className="hover:text-red-600 transition">Program</a>
                            <a href="#kontakt" className="hover:text-red-600 transition">Kontakt</a>
                            <button onClick={() => { setActiveTab('paka'); window.scrollTo(0, 0); }} className="px-4 py-2 border border-red-600 rounded-lg hover:bg-red-600 hover:text-white transition">Páka</button>
                        </div>
                        <button onClick={() => setIsMenuOpen(true)} className="lg:hidden text-red-600 p-2">
                            <Icon name="Menu" size={28} />
                        </button>
                    </div>
                </nav>
            );

            const HomeView = () => (
                <>
                    <header className="relative min-h-screen flex flex-col items-center justify-center overflow-hidden bg-neutral-950">
                        <div className="absolute inset-0 bg-black/70 z-10"></div>
                        <img src="https://images.unsplash.com/photo-1550547660-d9450f859349?auto=format&fit=crop&q=80&w=1920" className="absolute inset-0 w-full h-full object-cover" alt="Hero Background" />
                        
                        <div className="relative z-20 text-center px-4 max-w-4xl pt-48 pb-24 md:pt-64 md:pb-32 flex flex-col items-center">
                            <div className="flex flex-col items-center gap-6 mb-10">
                                <Countdown />
                                <div className="flex flex-col sm:flex-row justify-center items-center gap-4">
                                    <div className="inline-block px-4 py-2 border-2 border-red-600 text-red-600 text-[10px] font-black uppercase tracking-[0.3em] rounded-full bg-black/80 backdrop-blur-md">
                                        5. Jubilejní ročník
                                    </div>
                                    <div className="inline-block px-4 py-2 border-2 border-white text-white text-[10px] font-black uppercase tracking-[0.3em] rounded-full bg-red-700/80 backdrop-blur-md">
                                        Vstup Zdarma
                                    </div>
                                </div>
                            </div>
                            
                            <h1 className="text-4xl md:text-7xl font-black uppercase mb-4 leading-tight tracking-tighter text-white text-shadow-glow">
                                MALÍNSKÝ<br /><span className="text-red-600 italic">BURGER FESTIVAL</span>
                            </h1>
                            
                            <p className="text-lg md:text-2xl text-white font-bold mb-6 uppercase tracking-[0.2em] italic">27. Června 2026</p>
                            
                            {/* Lokalita v hlavičce podle obrázku */}
                            <div className="mb-10 flex flex-col items-center text-left border-l-4 border-red-600 pl-4 py-1">
                                <div className="text-xl md:text-2xl font-black italic uppercase text-red-600 leading-none mb-1">SOKOLOVNA NOVÝ MALÍN</div>
                                <div className="text-[10px] md:text-xs font-bold uppercase tracking-widest text-neutral-400">NOVÝ MALÍN 157, 788 03</div>
                            </div>

                            <div className="flex flex-col sm:flex-row gap-4 justify-center items-center flex-wrap">
                                <button 
                                    onClick={() => { setActiveTab('paka'); window.scrollTo(0,0); }}
                                    className="group bg-white text-black hover:bg-red-700 hover:text-white px-8 py-5 rounded-2xl font-black uppercase tracking-widest shadow-2xl transition-all transform hover:scale-105 flex items-center gap-4 text-sm"
                                >
                                    <Icon name="Trophy" className="group-hover:animate-bounce" /> TURNAJ V PÁCE
                                </button>
                                <a 
                                    href="#plakat"
                                    className="group bg-red-700 text-white border border-red-600 px-8 py-5 rounded-2xl font-black uppercase tracking-widest shadow-2xl transition-all flex items-center gap-4 text-sm hover:bg-red-600"
                                >
                                    <Icon name="FileText" className="text-white animate-pulse" /> ZOBRAZIT PLAKÁT
                                </a>
                                <a 
                                    href={tourneyPdfUrl}
                                    target="_blank"
                                    className="group bg-neutral-900/80 text-white border border-white/20 hover:border-red-600 px-8 py-5 rounded-2xl font-black uppercase tracking-widest shadow-2xl transition-all flex items-center gap-4 text-sm backdrop-blur-md"
                                >
                                    <Icon name="FileText" className="text-red-600" /> PLAKÁT TURNAJE (PDF)
                                </a>
                            </div>
                        </div>
                    </header>

                    <section className="bg-red-700 py-6 border-y border-red-500 relative z-30">
                        <div className="container mx-auto px-4 flex justify-center items-center gap-12 text-white text-center">
                            <div className="flex flex-col md:flex-row items-center gap-4">
                                <div className="text-[10px] font-black uppercase opacity-80 italic tracking-widest">K dispozici prostory:</div>
                                <div className="flex gap-4">
                                    <span className="font-black text-xs tracking-widest bg-black/20 px-4 py-2 rounded-lg border border-white/10 italic text-white">VENKOVNÍ</span>
                                    <span className="font-black text-xs tracking-widest bg-black/20 px-4 py-2 rounded-lg border border-white/10 italic text-white">VNITŘNÍ SOKOLOVNA</span>
                                </div>
                            </div>
                        </div>
                    </section>

                    <section id="info" className="py-24 bg-neutral-900 border-b border-white/5">
                        <div className="container mx-auto px-4">
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-16 items-center">
                                <div className="space-y-8 text-left">
                                    <h2 className="text-5xl font-black uppercase italic text-white tracking-tighter leading-none text-center md:text-left">Zábava pro<br /><span className="text-red-600">celou rodinu</span></h2>
                                    <p className="text-neutral-400 text-lg italic leading-relaxed text-center md:text-left">
                                        Festival nabízí vyžití za každého počasí. K dispozici jsou rozsáhlé venkovní plochy i vnitřní prostory sokolovny. Celý den je připraven bohatý program pro všechny generace.
                                    </p>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        <div className="p-6 bg-neutral-800 rounded-3xl border border-neutral-700">
                                            <Icon name="Users" size={24} className="text-red-600 mb-4" />
                                            <h4 className="font-black uppercase italic text-white mb-2">Rodinná Zóna</h4>
                                            <p className="text-xs text-neutral-500 leading-relaxed italic">V krytých prostorech najdete tvořivé dílny pro děti a kino vysílání oblíbených dětských pořadů.</p>
                                        </div>
                                        <div className="p-6 bg-neutral-800 rounded-3xl border border-neutral-700">
                                            <Icon name="Coffee" size={24} className="text-red-600 mb-4" />
                                            <h4 className="font-black uppercase italic text-white mb-2">Chill pro rodiče</h4>
                                            <p className="text-xs text-neutral-500 leading-relaxed italic">Zatímco si děti hrají, rodiče si mohou vychutnat výběrovou kávu v naší festivalové kavárničce.</p>
                                        </div>
                                    </div>
                                </div>
                                <div className="relative group">
                                    <div className="absolute -inset-4 bg-red-600/10 blur-3xl opacity-0 group-hover:opacity-100 transition duration-1000"></div>
                                    <div className="relative bg-neutral-800 p-8 rounded-[3rem] border border-neutral-700 shadow-2xl overflow-hidden">
                                        <div className="flex items-center gap-4 mb-8">
                                            <div className="w-12 h-12 bg-red-700 rounded-2xl flex items-center justify-center text-white font-black italic">!</div>
                                            <h3 className="text-2xl font-black uppercase italic tracking-tighter">Programové <span className="text-red-600">Highlighty</span></h3>
                                        </div>
                                        <ul className="space-y-6 text-left">
                                            <li className="flex gap-6 items-start">
                                                <div className="w-2 h-2 rounded-full bg-red-600 mt-2 shrink-0"></div>
                                                <p className="text-sm italic"><strong className="text-white block uppercase not-italic font-black">Armwrestling pod hlavičkou ČAWA</strong> Profesionální turnaj v hale a velkolepá Open show na venkovním pódiu.</p>
                                            </li>
                                            <li className="flex gap-6 items-start">
                                                <div className="w-2 h-2 rounded-full bg-red-600 mt-2 shrink-0"></div>
                                                <p className="text-sm italic"><strong className="text-white block uppercase not-italic font-black">KIA Open day</strong> Výstava nových vozů značky KIA po celý den konání festivalu.</p>
                                            </li>
                                            <li className="flex gap-6 items-start">
                                                <div className="w-2 h-2 rounded-full bg-red-600 mt-2 shrink-0"></div>
                                                <p className="text-sm italic"><strong className="text-white block uppercase not-italic font-black">Soutěže v pití tupláků</strong> Tradiční festivalová výzva pro ty nejrychlejší z vás o zajímavé ceny.</p>
                                            </li>
                                            <li className="flex gap-6 items-start">
                                                <div className="w-2 h-2 rounded-full bg-red-600 mt-2 shrink-0"></div>
                                                <p className="text-sm italic"><strong className="text-white block uppercase not-italic font-black">Venkovní Chill Zóna</strong> Pohodlné sezení a relaxační atmosféra přímo v centru dění pod širým nebem.</p>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* NOVÁ SEKCE: Hlavní Plakát Akce */}
                    <section id="plakat" className="py-24 bg-neutral-950 border-b border-white/5">
                        <div className="container mx-auto px-4 text-center">
                            <h2 className="text-4xl md:text-5xl font-black uppercase italic text-white tracking-tighter mb-6">Oficiální <span className="text-red-600">Plakát Akce</span></h2>
                            <p className="text-neutral-400 text-md italic mb-12 max-w-2xl mx-auto">Prohlédněte si kompletní program, seznam soutěžících a partnerů na oficiálním plakátu pro ročník 2026.</p>
                            
                            <div className="relative max-w-2xl mx-auto rounded-3xl overflow-hidden shadow-2xl border border-neutral-800 paka-card-glow group">
                                <a href={mainPosterUrl} target="_blank" rel="noopener noreferrer">
                                    <img 
                                        src={mainPosterUrl} 
                                        alt="Hlavní plakát Malínský Burger Festival 2026" 
                                        className="w-full h-auto object-cover hover:scale-[1.01] transition-transform duration-500 cursor-pointer"
                                        onError={(e) => {
                                            e.target.style.display = 'none';
                                            document.getElementById('poster-fallback').classList.remove('hidden');
                                        }}
                                    />
                                </a>
                                <div id="poster-fallback" className="hidden p-12 bg-neutral-900 text-neutral-400">
                                    <Icon name="FileText" size={64} className="mx-auto mb-4 text-red-600" />
                                    <p className="font-bold mb-2">Plakát se načítá nebo nebyl nalezen.</p>
                                    <p className="text-xs">Ujistěte se, že jste nahráli soubor <code className="text-white">MB_2026.jpg</code> do stejné složky jako index.html.</p>
                                </div>
                            </div>
                            <div className="mt-8">
                                <a 
                                    href={mainPosterUrl} 
                                    download
                                    className="inline-flex items-center gap-3 bg-red-700 hover:bg-red-600 text-white px-6 py-4 rounded-xl font-black uppercase text-xs tracking-widest transition-all"
                                >
                                    <Icon name="FileText" size={16} /> STÁHNOUT PLAKÁT (JPG)
                                </a>
                            </div>
                        </div>
                    </section>

                    {/* NOVÁ SEKCE: Pivovar Blud */}
                    <section id="pivo" className="py-24 bg-neutral-900 border-b border-white/5 relative">
                        <div className="container mx-auto px-4 text-center">
                            <div className="flex justify-center mb-6">
                                <div className="w-16 h-16 bg-red-700/20 border border-red-600/30 rounded-2xl flex items-center justify-center text-red-500 shadow-lg">
                                    <Icon name="Beer" size={36} />
                                </div>
                            </div>
                            <h2 className="text-4xl md:text-5xl font-black uppercase italic text-white tracking-tighter mb-4">
                                Pivo na čepu: <span className="text-red-600">Pivovar Blud</span>
                            </h2>
                            <p className="text-neutral-400 text-md italic mb-16 max-w-3xl mx-auto leading-relaxed">
                                Dovolujeme si vám představit exkluzivní pivní nabídku pro letošní ročník! Na čepu bude skvělé lokální řemeslné pivo z rodinného podniku <strong className="text-white">Kobzův pivovar Bludov</strong>. Vychutnejte si poctivé kousky perfektně vyladěné k našim burgerům.
                            </p>

                            <div className="grid grid-cols-1 md:grid-cols-3 gap-8 max-w-6xl mx-auto text-left">
                                {/* Tradiční desítka */}
                                <div className="clickable-card bg-neutral-950 p-8 rounded-[2.5rem] border border-neutral-800 flex flex-col justify-between">
                                    <div>
                                        <div className="inline-block py-1 px-3 bg-neutral-900 rounded-full text-neutral-400 font-black uppercase italic text-[9px] tracking-widest mb-4">
                                            Klasika
                                        </div>
                                        <h3 className="text-2xl font-black text-white uppercase italic tracking-tight mb-3">Tradiční desítka 10°</h3>
                                        <p className="text-neutral-400 text-sm leading-relaxed italic mb-6">
                                            Poctivé řemeslné světlé výčepní pivo. Lehká, perfektně pitelná klasika s jemným řízem a vyváženou chmelovou hořkostí – ideální společník pro osvěžení k burgeru během horkého letního dne.
                                        </p>
                                    </div>
                                    <div className="border-t border-neutral-900 pt-4 flex justify-between items-center text-[10px] font-black uppercase italic text-neutral-500">
                                        <span>Světlé výčepní</span>
                                        <span className="text-red-600 font-bold">Na čepu</span>
                                    </div>
                                </div>

                                {/* Bludná Malina - Speciál (Kyseláč) */}
                                <div className="clickable-card bg-neutral-950 p-8 rounded-[2.5rem] border-2 border-red-600 paka-card-glow flex flex-col justify-between relative overflow-hidden">
                                    <div className="absolute top-4 right-4 bg-red-600 text-white font-black uppercase italic text-[8px] tracking-widest px-3 py-1 rounded-full animate-pulse">
                                        SPECIÁL PRO FESTIVAL
                                    </div>
                                    <div>
                                        <div className="inline-block py-1 px-3 bg-red-950 text-red-400 rounded-full font-black uppercase italic text-[9px] tracking-widest mb-4">
                                            Osvěžující kyseláč
                                        </div>
                                        <h3 className="text-2xl font-black text-white uppercase italic tracking-tight mb-3">Bludná Malina 10°</h3>
                                        <p className="text-neutral-300 text-sm leading-relaxed italic mb-6">
                                            Skvostný, svrchně kvašený <strong className="text-red-500">kyseláč (Raspberry + Mint Sour Ale)</strong> uvařený exkluzivně pro Malínský Burger Festival! Unikátní várka piva s příjemně osvěžující nakyslou chutí čerstvých malin a jemným chladivým nádechem čerstvé máty v závěru. Kyseláč, který prostě musíte ochutnat!
                                        </p>
                                    </div>
                                    <div className="border-t border-red-900 pt-4 flex justify-between items-center text-[10px] font-black uppercase italic text-red-500">
                                        <span>Malina & Máta Sour Ale</span>
                                        <span className="text-red-600 font-bold">Unikátní kyseláč</span>
                                    </div>
                                </div>

                                {/* 14° NEIPA */}
                                <div className="clickable-card bg-neutral-950 p-8 rounded-[2.5rem] border border-neutral-800 flex flex-col justify-between">
                                    <div>
                                        <div className="inline-block py-1 px-3 bg-neutral-900 rounded-full text-neutral-400 font-black uppercase italic text-[9px] tracking-widest mb-4">
                                            Svrchně kvašené
                                        </div>
                                        <h3 className="text-2xl font-black text-white uppercase italic tracking-tight mb-3">14° NEIPA</h3>
                                        <p className="text-neutral-400 text-sm leading-relaxed italic mb-6">
                                            New England India Pale Ale. Bohatá chmelová aroma-bomba s typickým zákalem, plným tělem a sametově hladkým profilem plným intenzivních tónů tropického ovoce, manga a citrusů.
                                        </p>
                                    </div>
                                    <div className="border-t border-neutral-900 pt-4 flex justify-between items-center text-[10px] font-black uppercase italic text-neutral-500">
                                        <span>New England IPA</span>
                                        <span className="text-red-600 font-bold">Na čepu</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    <section id="jidlo" className="py-24 bg-neutral-950">
                        <div className="container mx-auto px-4 text-center">
                            <h2 className="text-5xl font-black uppercase italic text-white tracking-tighter mb-16">Mistři <span className="text-red-600">Grilu</span></h2>
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                                {foodVendors.map((v, i) => (
                                    <div key={i} className="clickable-card bg-neutral-900 p-8 rounded-[2.5rem] border border-neutral-800 text-left group">
                                        <div className="text-red-600 font-black text-5xl mb-6 italic transition-colors group-hover:text-red-500">#{i+1}</div>
                                        <h4 className="text-xl font-black text-white mb-4 uppercase italic tracking-tight leading-tight transition-colors">{v.name}</h4>
                                        <p className="text-neutral-400 text-sm leading-relaxed italic">{v.desc}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    <section id="program" className="py-24 bg-neutral-900 border-y border-white/5">
                        <div className="container mx-auto px-4 text-center">
                            <h2 className="text-4xl md:text-5xl font-black uppercase italic text-white tracking-tighter mb-16">Boj o titul <span className="text-red-600">Burgerfestu</span></h2>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-5xl mx-auto">
                                <div className="p-10 bg-neutral-950 rounded-[3rem] border border-red-600/20 hover:border-red-600 transition-all group">
                                    <div className="w-20 h-20 bg-red-700 rounded-3xl flex items-center justify-center mx-auto mb-8 shadow-2xl group-hover:scale-110 transition-transform">
                                        <Icon name="Users" size={40} className="text-white" />
                                    </div>
                                    <h3 className="text-2xl font-black uppercase italic mb-4">Hlasování diváků</h3>
                                    <p className="text-neutral-500 italic mb-6">Hlavní soutěž o nejlepší burger festivalu. Každý návštěvník má jeden hlas – vyberte svého favorita!</p>
                                    <div className="inline-block py-2 px-6 bg-white/5 rounded-full text-red-600 font-black uppercase italic text-xs tracking-widest">HLASUJÍ NÁVŠTĚVNÍCI</div>
                                </div>
                                <div className="p-10 bg-neutral-950 rounded-[3rem] border border-white/10 hover:border-white transition-all group">
                                    <div className="w-20 h-20 bg-white rounded-3xl flex items-center justify-center mx-auto mb-8 shadow-2xl group-hover:scale-110 transition-transform">
                                        <Icon name="Star" size={40} className="text-black" />
                                    </div>
                                    <h3 className="text-2xl font-black uppercase italic mb-4">Champion 2026</h3>
                                    <p className="text-neutral-500 italic mb-6">Prestižní souboj o putovní pohár. Vítěze vyhlásí odborná 4-členná porota.</p>
                                    <div className="inline-block py-2 px-6 bg-white/5 rounded-full text-white font-black uppercase italic text-xs tracking-widest">ODBORNÁ POROTA</div>
                                </div>
                            </div>
                        </div>
                    </section>

                    <section id="kontakt" className="py-24 bg-neutral-950 border-t border-white/5">
                        <div className="container mx-auto px-4 text-center">
                            <h2 className="text-5xl font-black uppercase italic text-white mb-12">Kontaktujte <span className="text-red-600">Nás</span></h2>
                            <div className="flex flex-col lg:flex-row justify-center items-center gap-12 max-w-6xl mx-auto">
                                <div className="flex flex-col items-center gap-4 flex-1">
                                    <div className="w-16 h-16 bg-red-700 rounded-2xl flex items-center justify-center shadow-lg">
                                        <Icon name="Mail" size={32} className="text-white" />
                                    </div>
                                    <p className="text-sm font-black uppercase tracking-widest text-neutral-500">Email pro dotazy</p>
                                    <a href="mailto:malinskyburgerfest@gmail.com" className="text-xl font-bold italic text-white hover:text-red-600 transition">malinskyburgerfest@gmail.com</a>
                                </div>
                                
                                <div className="flex flex-col items-center gap-4 flex-1 border-y lg:border-y-0 lg:border-x border-neutral-800 py-8 lg:px-12 w-full">
                                    <div className="w-16 h-16 bg-red-700 rounded-2xl flex items-center justify-center shadow-lg">
                                        <Icon name="MapPin" size={32} className="text-white" />
                                    </div>
                                    <p className="text-sm font-black uppercase tracking-widest text-neutral-500">Kde nás najdete</p>
                                    <p className="text-xl font-bold italic text-white">Sokolovna Nový Malín 157</p>
                                    <p className="text-xs uppercase font-black text-neutral-500 tracking-[0.3em]">788 03 Nový Malín</p>
                                </div>

                                <div className="flex flex-col items-center gap-4 flex-1">
                                    <div className="w-16 h-16 bg-red-700 rounded-2xl flex items-center justify-center shadow-lg">
                                        <Icon name="Phone" size={32} className="text-white" />
                                    </div>
                                    <p className="text-sm font-black uppercase tracking-widest text-neutral-500">Telefonní kontakt</p>
                                    <a href="tel:+420731022813" className="text-xl font-bold italic text-white hover:text-red-600 transition">731 022 813</a>
                                </div>
                            </div>
                        </div>
                    </section>

                    <section className="py-24 bg-neutral-950">
                        <div className="container mx-auto px-4 text-center">
                            <h2 className="text-[10px] font-black uppercase tracking-[0.5em] text-neutral-600 mb-16 italic">Oficiální Partneři & Podpora</h2>
                            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6 max-w-6xl mx-auto">
                                {partners.map((p, i) => (
                                    <a key={i} href={p.url} target="_blank" className="bg-neutral-900/20 p-6 rounded-3xl border border-neutral-800 hover:bg-neutral-900 transition-all group relative overflow-hidden flex flex-col items-center text-center">
                                        <div className="absolute top-0 left-0 w-1 h-full bg-red-600 transform -translate-x-full group-hover:translate-x-0 transition-transform"></div>
                                        <span className="text-sm font-black uppercase tracking-tighter text-stone-200 group-hover:text-red-600 transition-colors leading-tight">{p.name}</span>
                                        <span className="text-[8px] uppercase tracking-[0.2em] text-neutral-600 mt-2 font-bold italic leading-none">{p.role}</span>
                                    </a>
                                ))}
                            </div>
                        </div>
                    </section>
                </>
            );

            const PakaView = () => (
                <div className="pt-32 pb-24 min-h-screen bg-neutral-950 px-4 md:px-8">
                    <div className="max-w-6xl mx-auto mt-10 bg-neutral-900 p-8 md:p-16 rounded-[3.5rem] border border-red-600/20 paka-card-glow relative overflow-hidden">
                        <div className="absolute top-0 right-0 p-8 opacity-5 pointer-events-none text-white"><Icon name="Trophy" size={300} /></div>
                        
                        <div className="flex flex-col md:flex-row justify-between items-center mb-12 gap-6 relative z-10">
                            <button onClick={goToHome} className="text-red-600 font-black uppercase text-xs flex items-center gap-2 tracking-widest hover:translate-x-1 transition-transform">
                                <Icon name="ChevronRight" className="rotate-180" size={16} /> Zpět na úvod
                            </button>
                            <a 
                                href={tourneyPdfUrl}
                                target="_blank"
                                className="bg-white/10 hover:bg-white/20 text-white px-6 py-3 rounded-xl font-black uppercase text-[10px] tracking-widest flex items-center gap-3 transition-all border border-white/10"
                            >
                                <Icon name="FileText" size={16} className="text-red-600" /> Plakát Turnaje (PDF)
                            </a>
                        </div>

                        <h2 className="text-4xl md:text-7xl font-black uppercase italic mb-10 text-white leading-none tracking-tighter relative z-10 text-center lg:text-left">ARMWRESTLING <span className="text-red-600">CHAMPION</span></h2>
                        
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-16 text-white relative z-10 text-left">
                            <div className="space-y-10">
                                <div>
                                    <h3 className="text-red-600 font-black uppercase mb-6 italic tracking-widest border-b border-red-600/10 pb-2">Váhové Kategorie</h3>
                                    <ul className="space-y-3 font-bold uppercase italic text-[11px] md:text-xs">
                                        <li className="bg-neutral-800/50 p-4 rounded-2xl border-l-4 border-red-600">
                                            <span className="text-white block mb-1">Chlapci / Dívky (U15)</span>
                                            <span className="text-neutral-400">Bez omezení</span>
                                        </li>
                                        <li className="bg-neutral-800/50 p-4 rounded-2xl border-l-4 border-red-700">
                                            <span className="text-white block mb-1">Nováčci</span>
                                            <span className="text-neutral-400">-85 kg, +85 kg</span>
                                        </li>
                                        <li className="bg-neutral-800/50 p-4 rounded-2xl border-l-4 border-red-600">
                                            <span className="text-white block mb-1">Junioři U18</span>
                                            <span className="text-neutral-400">-75 kg, -85 kg, +85 kg</span>
                                        </li>
                                        <li className="bg-neutral-800/50 p-4 rounded-2xl border-l-4 border-red-700">
                                            <span className="text-white block mb-1">Seniorky</span>
                                            <span className="text-neutral-400">-65 kg, +65 kg</span>
                                        </li>
                                        <li className="bg-neutral-800/50 p-4 rounded-2xl border-l-4 border-red-600">
                                            <span className="text-white block mb-1">Senioři</span>
                                            <span className="text-neutral-400">-75 kg, -85 kg, -95 kg, +95 kg</span>
                                        </li>
                                        <li className="bg-neutral-800/50 p-4 rounded-2xl border-l-4 border-white/20">
                                            <span className="text-white block mb-1">Masters</span>
                                            <span className="text-neutral-400">-100 kg, +100 kg</span>
                                        </li>
                                    </ul>
                                </div>
                                <div className="bg-neutral-800/50 p-6 rounded-2xl border border-red-600/20 text-center lg:text-left">
                                    <h4 className="text-red-600 font-black uppercase text-[10px] mb-2 tracking-widest">KATEGORIE OPEN</h4>
                                    <p className="text-xs text-white italic font-bold">Celá kategorie na hlavním pódiu od 16:00!</p>
                                    <div className="mt-3 flex gap-4 text-[10px] font-black uppercase justify-center lg:justify-start">
                                        <span className="text-red-600">1. místo: 5000 Kč</span>
                                        <span className="text-neutral-300">2. místo: 2000 Kč</span>
                                        <span className="text-neutral-400">3. místo: 1000 Kč</span>
                                    </div>
                                </div>
                            </div>

                            <div className="space-y-10">
                                <div className="bg-red-700 p-8 rounded-[2.5rem] text-center shadow-lg border border-red-500/50">
                                    <h4 className="font-black uppercase mb-6 text-3xl italic text-white tracking-tighter leading-none">Online<br/>Registrace</h4>
                                    <a href={googleFormUrl} target="_blank" className="block w-full bg-black text-white py-5 rounded-2xl font-black uppercase hover:bg-neutral-900 transition-all text-sm tracking-widest">Registrovat se zde</a>
                                </div>

                                <div className="bg-neutral-800/50 p-10 rounded-[2.5rem] border border-neutral-700/50 text-center">
                                    <h3 className="text-white font-black uppercase mb-8 italic tracking-widest">Startovné (Člen / Nováček)</h3>
                                    <div className="space-y-6">
                                        <div className="pb-6 border-b border-neutral-700/50">
                                            <p className="text-red-600 font-black uppercase text-[10px] tracking-widest mb-1">Senioři / Masters / Seniorky</p>
                                            <p className="text-neutral-200 font-bold italic text-sm">250 Kč / 350 Kč</p>
                                        </div>
                                        <div>
                                            <p className="text-white font-black uppercase text-[10px] tracking-widest mb-1">Junioři (U15 - U18)</p>
                                            <p className="text-neutral-200 font-bold italic text-sm">150 Kč / 250 Kč</p>
                                        </div>
                                        <p className="text-[9px] uppercase font-bold text-neutral-500 italic mt-4">Cena za jednu ruku / obě ruce</p>
                                    </div>
                                </div>
                                <div className="p-6 bg-neutral-800/30 rounded-3xl border-l-4 border-white">
                                    <h4 className="text-white font-black uppercase text-[10px] mb-4 tracking-widest">Harmonogram Páka</h4>
                                    <div className="space-y-2 text-[11px] text-neutral-400 italic">
                                        <p className="flex items-center gap-2"><div className="w-1.5 h-1.5 rounded-full bg-red-600"></div> 08:00 - 10:00 Váha (Sokolovna)</p>
                                        <p className="flex items-center gap-2"><div className="w-1.5 h-1.5 rounded-full bg-red-600"></div> 11:00 START turnaje</p>
                                        <p className="flex items-center gap-2"><div className="w-1.5 h-1.5 rounded-full bg-red-600"></div> 16:00 OPEN show (Pódium)</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen bg-neutral-950 text-white selection:bg-red-600 overflow-x-hidden">
                    <Navigation />
                    <main>
                        {activeTab === 'home' ? <HomeView /> : <PakaView />}
                    </main>
                    <footer className="bg-black py-20 text-center border-t border-neutral-900">
                        <div className="text-2xl font-black italic tracking-tighter mb-4 uppercase text-stone-200">
                            Nový <span className="text-red-600 underline decoration-4 underline-offset-8">Malín</span> 2026
                        </div>
                        <div className="space-y-4 max-w-3xl mx-auto px-4 mt-8 text-center flex flex-col items-center">
                            <div className="text-[10px] uppercase font-black text-neutral-500 tracking-[0.3em] mb-4">
                                Sokolovna Nový Malín 157, 788 03
                            </div>
                            <div className="flex flex-col md:flex-row justify-center items-center gap-4 text-[12px] md:text-[13px] uppercase font-black tracking-[0.2em] flex-wrap">
                                <span className="text-neutral-200 italic">© 2026 Malínský Burger Festival</span>
                                <span className="hidden md:inline text-neutral-600">|</span>
                                <span className="text-red-600 italic underline decoration-2 underline-offset-4 cursor-pointer" onClick={() => window.open(mainPosterUrl, '_blank')}>Hlavní Plakát (JPG)</span>
                                <span className="hidden md:inline text-neutral-600">|</span>
                                <span className="text-red-600 italic underline decoration-2 underline-offset-4 cursor-pointer" onClick={() => window.open(tourneyPdfUrl, '_blank')}>Plakát turnaje (PDF)</span>
                                <span className="hidden md:inline text-neutral-600">|</span>
                                <span className="text-neutral-400 italic font-bold">Moderuje: Petr Kamlar</span>
                            </div>
                        </div>
                    </footer>

                    {isMenuOpen && (
                        <div className="mobile-menu-overlay fixed inset-0 flex flex-col items-center justify-center space-y-8 p-10 animate-in slide-in-from-right">
                            <button onClick={() => setIsMenuOpen(false)} className="absolute top-6 right-6 text-red-600"><Icon name="X" size={48} /></button>
                            <button onClick={() => { goToHome(); setIsMenuOpen(false); }} className="text-3xl font-black uppercase italic text-white hover:text-red-600 transition">Domů</button>
                            <a href="#info" onClick={() => setIsMenuOpen(false)} className="text-3xl font-black uppercase italic text-white hover:text-red-600 transition">O Festivalu</a>
                            <a href="#plakat" onClick={() => setIsMenuOpen(false)} className="text-3xl font-black uppercase italic text-white hover:text-red-600 transition">Plakát Akce</a>
                            <a href="#pivo" onClick={() => setIsMenuOpen(false)} className="text-3xl font-black uppercase italic text-white hover:text-red-600 transition">Pivo na čepu</a>
                            <a href="#jidlo" onClick={() => setIsMenuOpen(false)} className="text-3xl font-black uppercase italic text-white hover:text-red-600 transition">Gril</a>
                            <button onClick={() => { setActiveTab('paka'); setIsMenuOpen(false); window.scrollTo(0, 0); }} className="text-3xl font-black uppercase italic text-red-600">Turnaj Páka</button>
                            <a href={tourneyPdfUrl} target="_blank" className="text-3xl font-black uppercase italic text-white hover:text-red-600 transition">Plakát turnaje (PDF)</a>
                            <a href="#kontakt" onClick={() => setIsMenuOpen(false)} className="text-3xl font-black uppercase italic text-white hover:text-red-600 transition">Kontakt</a>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
